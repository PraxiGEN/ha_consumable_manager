# 用户库贡献自动组装（PR 模式）
#
# 流程：
#   1. 贡献者在自己的分支（同仓库）放 contributions/<GitHub用户名>/user_library.json，
#      向 main 提 PR（不同用户不同目录，并行 PR 不冲突）；
#   2. 本工作流在 PR 上下文自动处理草稿：
#      - 仅运行仓库自带（main 上的）摄入工具代码：只把 tools/ 恢复成 main 版本，
#        草稿只作为数据喂入，绝不执行 PR 内的任何代码（防供应链风险）；
#        注意：不要覆盖 library/ —— 否则后续检查会误判成「main 老数据」，
#        而草稿 PR 的 library/ 本就等于 main，组装仍基于最新主分支；
#      - 组装完成后移除整个 contributions/ 目录；
#      - 组装结果 + 草稿删除一起提交回 PR 头；
#   3. 维护者审查后合并 PR 进 main：净效果仅为 library/ 变更，草稿不进主分支。
#
# 防循环：paths 过滤只认 contributions/**/user_library.json；摄入后该文件被删除，
#         回写提交不再包含它，故不会再次触发；即便触发，无草稿即空操作、不提交。
#
# 分支模型说明：本工作流面向「同仓库分支发起的 PR」（贡献者对仓库有写权限、
# 或维护者从分支取）。fork PR 因 GitHub 安全限制无法由本工作流回推，
# 需在 fork 侧自行同步已组装的 library/ 后再合入。
name: Ingest user-library contributions

on:
  pull_request_target:
    branches: [main]
    paths:
      - "contributions/**/user_library.json"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Restore trusted ingest tool from main
        # 安全：只恢复仓库自带（main 上的）摄入工具代码，绝不执行 PR 内代码
        # （防供应链风险）。不覆盖 library/ —— 草稿 PR 的 library/ 本就等于
        # main，覆盖反而让后续检查误判成「main 老数据」。
        run: |
          git fetch origin main
          git checkout origin/main -- tools/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate contribution drafts
        # 真正校验的是 PR 的草稿（contributions/），而非 main 的库；
        # 草稿不符合当前规则（如旧 schema_version、纯字符串 name、已废弃字段）
        # 直接失败并指明具体草稿文件，绝不误报成 main 老数据。
        run: python tools/ingest.py --validate-draft --verbose

      - name: Ingest all drafts under contributions/
        # 工具只读取 PR 中的 contributions/ 文件夹（contributions/*/user_library.json）；
        # library 路径由 ingest.py 按自身位置自动解析（集成根目录下的 library/），无需手写。
        run: python tools/ingest.py --ingest --verbose

      - name: Post-ingest check
        run: python tools/ingest.py --check

      - name: Commit assembled library back to PR head
        run: |
          git add custom_components/consumable_manager/library/
          # 组装后移除全部草稿目录（先加后删）：文件相对 main 净变化为零，
          # 合并进 main 时不会把用户库带进主分支（git merge 是全量 diff）。
          git rm -rq --ignore-unmatch contributions/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes (nothing new to ingest)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: ingest user-library contributions (drafts removed after assembly)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
