bind_entity:
  name: "{{ name }}"
  description: "{{ description }}"
  fields:
    entity_id:
      required: true
      name: "{{ name }}"
      description: "{{ description }}"
      example: sensor.filter_life
      selector:
        entity:
          domain: sensor
    consumable_id:
      required: false
      name: "{{ name }}"
      description: "{{ description }}"
      example: filter_hepa13
      selector:
        text: {}
    item:
      required: false
      name: "{{ name }}"
      description: "{{ description }}"
      selector:
        entity:
          domain: sensor
          integration: consumable_manager
    group_id:
      required: false
      name: "{{ name }}"
      description: "{{ description }}"
      example: default
      selector:
        text: {}
unbind_entity:
  name: "{{ name }}"
  description: "{{ description }}"
  fields:
    entity_id:
      required: true
      name: "{{ name }}"
      description: "{{ description }}"
      example: sensor.filter_life
      selector:
        entity:
          domain: sensor

query_binding:
  name: "{{ name }}"
  description: "{{ description }}"
  fields:
    entity_id:
      required: false
      name: "{{ name }}"
      description: "{{ description }}"
      example: sensor.filter_life
      selector:
        entity:
          domain: sensor
    consumable_id:
      required: false
      name: "{{ name }}"
      description: "{{ description }}"
      example: filter_hepa13
      selector:
        text: {}
    item:
      required: false
      name: "{{ name }}"
      description: "{{ description }}"
      selector:
        entity:
          domain: sensor
          integration: consumable_manager

add_consumable:
  name: "{{ name }}"
  description: "{{ description }}"
  fields:
    cons_type:
      required: true
      name: "{{ name }}"
      description: "{{ description }}"
      example: filter
      # 下拉列出内置类型；用户库自定义类型不在静态选项中，
      # 靠 custom_value 手输，后端 async_add_consumable 的库类型校验兜底。
      selector:
        select:
          mode: dropdown
          custom_value: true
          translation_key: entry_type
          options:
            - battery
            - filter
            - humidifier
            - ink
            - robot_vacuum
            - water_purifier
    model:
      required: true
      name: "{{ name }}"
      description: "{{ description }}"
      example: HEPA-13
      selector:
        text: {}
    name:
      required: true
      name: "{{ name }}"
      description: "{{ description }}"
      example: HEPA 13 filter
      selector:
        text: {}
    unit:
      required: true
      name: "{{ name }}"
      description: "{{ description }}"
      example: 个
      selector:
        text: {}
    meta:
      required: false
      name: "{{ name }}"
      description: "{{ description }}"
      example: {"grade": "H13"}
      selector:
        object: {}

add_type:
  name: "{{ name }}"
  description: "{{ description }}"
  fields:
    type_key:
      required: true
      name: "{{ name }}"
      description: "{{ description }}"
      example: air_conditioner
      selector:
        text: {}
    name:
      required: true
      name: "{{ name }}"
      description: "{{ description }}"
      example: 空调滤网
      selector:
        text: {}
    icon:
      required: false
      name: "{{ name }}"
      description: "{{ description }}"
      example: mdi:air-conditioner
      selector:
        text: {}
    default_threshold_type:
      required: true
      name: "{{ name }}"
      description: "{{ description }}"
      default: lifetime_percent
      selector:
        select:
          options:
            - lifetime_percent
            - remaining_time
            - used_time
          translation_key: threshold_type
    default_threshold:
      required: true
      name: "{{ name }}"
      description: "{{ description }}"
      default: 20
      example: 20
      selector:
        number:
          min: 0
          step: 1
    default_threshold_unit:
      required: true
      name: "{{ name }}"
      description: "{{ description }}"
      default: "%"
      selector:
        select:
          options:
            - "%"
            - minutes
            - hours
            - days
          translation_key: threshold_unit

query_data:
  name: "{{ name }}"
  description: "{{ description }}"
  fields:
    data_type:
      required: true
      name: "{{ name }}"
      description: "{{ description }}"
      example: stock
      selector:
        select:
          options:
            - stock
            - type_entry
            - group_data
            - types
            - consumables
          mode: dropdown
          translation_key: service_data_type
    consumable_type:
      required: false
      name: "{{ name }}"
      description: "{{ description }}"
      example: filter
      selector:
        select:
          mode: dropdown
          custom_value: true
          translation_key: entry_type
          options:
            - battery
            - filter
            - humidifier
            - ink
            - robot_vacuum
            - water_purifier
    entry_id:
      # 条目选择框：用 config_entry 选择器列出本集成已添加的条目，用户无需知道条目 ID。
      required: false
      name: "{{ name }}"
      description: "{{ description }}"
      selector:
        config_entry:
          integration: consumable_manager
    group_entity:
      # 分组选择框：用实体选择器列出本集成的分组传感器（诊断实体 / 分组数据实体），
      # 用户选中“某个分组对应的实体”即可，服务内部经实体注册表反查 unique_id 得到真实 group_id。
      required: false
      name: "{{ name }}"
      description: "{{ description }}"
      selector:
        entity:
          integration: consumable_manager
          domain: sensor
    triggered_only:
      required: false
      name: "{{ name }}"
      description: "{{ description }}"
      selector:
        boolean: {}

adjust_stock:
  name: "{{ name }}"
  description: "{{ description }}"
  fields:
    action:
      required: true
      name: "{{ name }}"
      description: "{{ description }}"
      default: add
      selector:
        select:
          options:
            - add
            - consume
          translation_key: service_action
    item:
      required: false
      name: "{{ name }}"
      description: "{{ description }}"
      selector:
        entity:
          domain: sensor
          integration: consumable_manager
    quantity:
      required: true
      name: "{{ name }}"
      description: "{{ description }}"
      default: 0
      example: 1
      selector:
        number:
          min: -9999
          step: 1